name: publish

on:
  release:
    # both release and prereleases
    types: [published]
  # support manual release in case something goes wrong and needs to be repeated or tested
  workflow_dispatch:
    inputs:
      tag:
        description: github tag that needs to publish
        type: string
        required: true

jobs:
  # parses the package.json version and detects prerelease tag (ex: beta from 4.4.4-beta.0)
  getDistTag:
    outputs:
      tag: ${{ steps.distTag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag  }}
      - uses: salesforcecli/github-workflows/.github/actions/getPreReleaseTag@main
        id: distTag

  npm:
    uses: ./.github/workflows/npmPublish.yml
    needs: [getDistTag]
    with:
      # Temporarily disabled to bypass the active Dreamforce 2026 change
      # moratorium (Global Change Management, through 2026-09-18 06:59 UTC),
      # which blocks CTC case creation with ERROR_HTTP_400 "Conflicts Detected!
      # Found 1 lock(s) for CI: NPM". Re-enable (ctc: true) once it lifts.
      ctc: false
      sign: true
      tag: ${{ needs.getDistTag.outputs.tag || 'latest' }}
      githubTag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
